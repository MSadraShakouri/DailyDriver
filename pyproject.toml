[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailydriver"
version = "2.0.0"
description = "Personal terminal‑based life tracker (prayer, sleep, journal, calendar, search)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jdatetime",
    "hijridate",
    "porter2stemmer",
    "prompt_toolkit>=3",
]

[project.optional-dependencies]
test = [
    "coverage>=7",
    "pytest>=8",
]

[project.scripts]
daily = "dailydriver.cli.commander:repl"

[tool.setuptools.packages.find]
include = ["dailydriver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["dailydriver"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
