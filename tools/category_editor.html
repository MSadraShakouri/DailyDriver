<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
<title>Category Editor</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px;
    margin: 0;
    background: #f5f5f5;
    color: #333;
    padding-bottom: 80px;
  }
  header {
    background: #007bff;
    color: white;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0 0 10px 0; font-size: 22px; }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar button {
    font-size: 15px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px;
    background: rgba(255,255,255,.15);
    color: white;
    cursor: pointer;
    touch-action: manipulation;
  }
  .toolbar button:active { background: rgba(255,255,255,.35); }
  #search {
    flex: 1 1 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 8px;
    background: white;
    color: #333;
  }
  main { padding: 12px 16px; }

  /* ---- suggestions ---- */
  #suggestions { display: none; margin-bottom: 12px; }
  #suggestions .card {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #suggestions .pair { flex: 1 1 100%; font-size: 16px; word-break: break-all; }
  #suggestions .score {
    background: #f9a825;
    color: white;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 13px;
    white-space: nowrap;
  }
  #suggestions .no-match { color: #795548; font-size: 15px; }

  /* ---- table ---- */
  .table-wrap {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
  th { font-size: 14px; text-transform: uppercase; color: #777; letter-spacing: .4px; }
  tr:last-child td { border-bottom: none; }
  tr.cat-row { cursor: default; }
  tr.cat-row:active { background: #f0f7ff; }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; word-break: break-all; }
  .entries-cell { white-space: nowrap; }
  .count { display: inline-block; min-width: 2ch; font-weight: 600; }
  .toggle-btn {
    border: 1px solid #ccc;
    background: white;
    border-radius: 6px;
    padding: 2px 8px;
    margin-left: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  .actions { white-space: nowrap; }
  .actions button {
    font-size: 14px;
    padding: 6px 10px;
    margin-right: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
  }
  .actions button:disabled { opacity: .4; cursor: not-allowed; }
  .actions .danger { color: #c62828; border-color: #ef9a9a; }
  .actions .warn { color: #e65100; border-color: #ffcc80; }

  /* ---- entry preview ---- */
  tr.preview-row td { background: #fafafa; padding: 0; }
  .preview-box {
    max-height: 220px;
    overflow-y: auto;
    padding: 10px 14px;
    border-top: 2px solid #e3f2fd;
  }
  .preview-entry { padding: 6px 0; border-bottom: 1px dashed #e0e0e0; font-size: 15px; word-break: break-word; }
  .preview-entry:last-child { border-bottom: none; }
  .preview-entry .ts { color: #999; font-size: 13px; margin-right: 8px; }
  .preview-more { padding: 8px 0 2px 0; color: #777; font-size: 14px; font-style: italic; }
  .preview-empty, .preview-loading { color: #777; font-size: 15px; padding: 10px 14px; }

  /* ---- modals ---- */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    width: 100%;
    max-width: 460px;
    padding: 18px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .modal h2 { margin: 0 0 14px 0; font-size: 19px; }
  .modal label { display: block; font-size: 14px; color: #555; margin: 12px 0 4px 0; }
  .modal input[type=text], .modal select {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
  }
  .modal select { appearance: auto; }
  .modal .hint { font-size: 13px; color: #888; margin-top: 4px; }
  .modal .result-name { font-size: 14px; color: #1565c0; margin-top: 8px; word-break: break-all; }
  .radio-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 16px; }
  .radio-row input { width: auto; }
  .confirm-row { display: flex; gap: 8px; align-items: center; }
  .confirm-row span { font-family: ui-monospace, Menlo, monospace; font-size: 15px; white-space: nowrap; }
  .confirm-row input { flex: 1; }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal .btns button {
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
    cursor: pointer;
  }
  .modal .btns .primary { background: #007bff; border-color: #007bff; color: white; }
  .modal .btns .danger { background: #c62828; border-color: #c62828; color: white; }
  .modal .btns button:disabled { opacity: .45; cursor: not-allowed; }
  .modal .info { font-size: 15px; background: #e3f2fd; border-radius: 8px; padding: 10px 12px; margin-bottom: 4px; }

  /* ---- toasts ---- */
  #toasts {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(92vw, 420px);
  }
  .toast {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: white;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    animation: slide-up .18s ease-out;
    word-break: break-word;
  }
  .toast.success { background: #2e7d32; }
  .toast.error { background: #c62828; }
  .toast.warning { background: #ef6c00; }
  @keyframes slide-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .empty-note { text-align: center; color: #888; padding: 30px 16px; font-size: 16px; }
  .muted { color: #888; }
</style>
</head>
<body>

<header>
  <h1>Category Editor</h1>
  <div class="toolbar">
    <button id="refresh-btn" type="button">&#x21bb; Refresh</button>
    <button id="suggest-btn" type="button">Find Suggestions</button>
  </div>
  <input id="search" type="search" placeholder="Search categories&hellip;" autocomplete="off">
</header>

<main>
  <section id="suggestions" aria-live="polite"></section>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Path</th><th>Entries</th><th>Actions</th></tr>
      </thead>
      <tbody id="cat-tbody"></tbody>
    </table>
    <div id="empty-note" class="empty-note" style="display:none"></div>
  </div>
</main>

<!-- Rename modal -->
<div class="modal-backdrop" id="rename-modal">
  <div class="modal">
    <h2>Rename Category</h2>
    <div class="info" id="rename-info"></div>
    <label for="rename-input">New path</label>
    <input type="text" id="rename-input" autocomplete="off">
    <div class="hint">Must be non-empty and unique (case-insensitive). Entries and keywords follow automatically.</div>
    <div class="btns">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="primary" id="rename-submit">Rename</button>
    </div>
  </div>
</div>

<!-- Merge modal -->
<div class="modal-backdrop" id="merge-modal">
  <div class="modal">
    <h2>Merge Categories</h2>
    <label for="merge-source">Source (to be deleted)</label>
    <select id="merge-source"></select>
    <label for="merge-target">Target (to be kept)</label>
    <select id="merge-target"></select>
    <label>Resulting name</label>
    <div class="radio-row"><input type="radio" name="merge-name" id="mn-source" value="source"><label for="mn-source">Source name</label></div>
    <div class="radio-row"><input type="radio" name="merge-name" id="mn-target" value="target" checked><label for="mn-target">Target name</label></div>
    <div class="radio-row"><input type="radio" name="merge-name" id="mn-custom" value="custom"><label for="mn-custom">Custom name</label></div>
    <div id="custom-name-wrap" style="display:none">
      <input type="text" id="custom-name" autocomplete="off" placeholder="custom/path">
    </div>
    <div class="result-name" id="merge-result-name"></div>
    <label for="merge-confirm">Type <b>merge</b> to confirm</label>
    <div class="confirm-row">
      <span>merge</span>
      <input type="text" id="merge-confirm" autocomplete="off">
    </div>
    <div class="hint">Entries already tagged with both categories keep only the target. Keyword counts are summed.</div>
    <div class="btns">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="warn primary" id="merge-submit" style="background:#e65100;border-color:#e65100" disabled>Merge</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-backdrop" id="delete-modal">
  <div class="modal">
    <h2>Delete Category</h2>
    <div class="info" id="delete-info"></div>
    <label for="delete-confirm">Type <b>delete</b> to confirm</label>
    <div class="confirm-row">
      <span>delete</span>
      <input type="text" id="delete-confirm" autocomplete="off">
    </div>
    <div class="btns">
      <button type="button" class="cancel">Cancel</button>
      <button type="button" class="danger" id="delete-submit" disabled>Delete</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="assertive"></div>

<script>
(function () {
  "use strict";

  const state = {
    categories: [],
    previewCache: {},     // category_id -> {entries, total, has_more}
    openPreview: null,    // currently expanded category id
    search: "",
  };

  const $ = (sel) => document.querySelector(sel);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function toast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast " + (kind || "success");
    el.textContent = message;
    $("#toasts").appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    let data;
    try { data = await res.json(); }
    catch (e) { data = { error: "Invalid response from server." }; }
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data;
  }

  async function post(path, body) {
    return api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  }

  // ---------- categories table ----------

  async function loadCategories() {
    state.categories = await api("/categories");
    state.previewCache = {};
    state.openPreview = null;
    renderTable();
  }

  function visibleCategories() {
    const q = state.search.toLowerCase();
    return state.categories.filter((c) => !q || c.path.toLowerCase().includes(q));
  }

  function renderTable() {
    const tbody = $("#cat-tbody");
    tbody.innerHTML = "";
    const rows = visibleCategories();
    $("#empty-note").style.display = rows.length ? "none" : "block";
    $("#empty-note").textContent = state.categories.length
      ? "No categories match your search."
      : "No categories yet. Add some by logging entries.";

    for (const c of rows) {
      const tr = document.createElement("tr");
      tr.className = "cat-row";

      const tdPath = document.createElement("td");
      const pathEl = document.createElement("span");
      pathEl.className = "path";
      pathEl.textContent = c.path;
      tdPath.appendChild(pathEl);

      const tdEntries = document.createElement("td");
      tdEntries.className = "entries-cell";
      const countEl = document.createElement("span");
      countEl.className = "count";
      countEl.textContent = c.entry_count;
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "toggle-btn";
      toggle.textContent = "\u{1F4C4}";
      toggle.title = "Preview entries";
      toggle.disabled = c.entry_count === 0;
      toggle.addEventListener("click", () => togglePreview(c.id));
      tdEntries.append(countEl, toggle);

      const tdActions = document.createElement("td");
      tdActions.className = "actions";
      const renameBtn = document.createElement("button");
      renameBtn.textContent = "Rename";
      renameBtn.addEventListener("click", () => openRename(c));
      const mergeBtn = document.createElement("button");
      mergeBtn.textContent = "Merge";
      mergeBtn.className = "warn";
      mergeBtn.addEventListener("click", () => openMerge(c.id, null));
      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.className = "danger";
      delBtn.disabled = c.entry_count > 0;
      delBtn.title = c.entry_count > 0
        ? "Delete disabled: category has entries"
        : "Delete this (empty) category";
      delBtn.addEventListener("click", () => openDelete(c));
      tdActions.append(renameBtn, mergeBtn, delBtn);

      tr.append(tdPath, tdEntries, tdActions);
      tbody.appendChild(tr);

      if (state.openPreview === c.id) {
        const prevTr = document.createElement("tr");
        prevTr.className = "preview-row";
        const td = document.createElement("td");
        td.colSpan = 3;
        td.appendChild(previewBox(c));
        prevTr.appendChild(td);
        tbody.appendChild(prevTr);
      }
    }
  }

  function previewBox(c) {
    const box = document.createElement("div");
    const cached = state.previewCache[c.id];
    if (cached) {
      fillPreview(box, cached);
    } else {
      box.innerHTML = '<div class="preview-loading">Loading&hellip;</div>';
      api("/entries?category_id=" + c.id)
        .then((data) => {
          state.previewCache[c.id] = data;
          fillPreview(box, data);
        })
        .catch((e) => {
          box.innerHTML = '<div class="preview-loading">' + esc(e.message) + "</div>";
        });
    }
    box.className = "preview-box";
    return box;
  }

  function fillPreview(box, data) {
    box.innerHTML = "";
    if (!data.entries.length) {
      box.innerHTML = '<div class="preview-empty">No entries.</div>';
      return;
    }
    for (const e of data.entries) {
      const row = document.createElement("div");
      row.className = "preview-entry";
      const txt = document.createElement("span");
      txt.textContent = e.description || "(no description)";
      row.appendChild(txt);
      box.appendChild(row);
    }
    if (data.has_more) {
      const more = document.createElement("div");
      more.className = "preview-more";
      more.textContent = "\u2026 and " + (data.total - data.entries.length) + " more";
      box.appendChild(more);
    }
  }

  async function togglePreview(id) {
    state.openPreview = state.openPreview === id ? null : id;
    renderTable();
  }

  // ---------- suggestions ----------

  async function findSuggestions() {
    const section = $("#suggestions");
    section.style.display = "block";
    section.innerHTML = '<div class="no-match">Checking for near-duplicates&hellip;</div>';
    try {
      const data = await api("/suggest");
      section.innerHTML = "";
      if (!data.length) {
        section.innerHTML = '<div class="no-match">No near-duplicate categories found (similarity &ge; 0.80).</div>';
        return;
      }
      for (const s of data) {
        const card = document.createElement("div");
        card.className = "card";
        const pair = document.createElement("div");
        pair.className = "pair";
        pair.innerHTML = "<b>" + esc(s.source_path) + "</b> &rarr; <b>" + esc(s.target_path) + "</b>";
        const score = document.createElement("span");
        score.className = "score";
        score.textContent = "similarity " + s.similarity;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Merge";
        btn.style.cssText = "font-size:14px;padding:6px 12px;border-radius:6px;border:1px solid #f9a825;background:#fff3cd;cursor:pointer;";
        btn.addEventListener("click", () => openMerge(s.source_id, s.target_id));
        card.append(pair, score, btn);
        section.appendChild(card);
      }
    } catch (e) {
      section.innerHTML = '<div class="no-match">' + esc(e.message) + "</div>";
    }
  }

  // ---------- modals ----------

  function openModal(id) {
    $("#" + id).classList.add("open");
  }
  function closeModals() {
    document.querySelectorAll(".modal-backdrop").forEach((m) => m.classList.remove("open"));
  }
  document.querySelectorAll(".modal-backdrop").forEach((m) => {
    m.addEventListener("click", (e) => { if (e.target === m) closeModals(); });
    m.querySelectorAll(".cancel").forEach((b) => b.addEventListener("click", closeModals));
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModals(); });

  // ---- rename ----
  let renameTarget = null;

  function openRename(c) {
    renameTarget = c;
    $("#rename-info").textContent = "Current path: " + c.path;
    const input = $("#rename-input");
    input.value = c.path;
    openModal("rename-modal");
    input.focus();
    input.select();
  }

  $("#rename-submit").addEventListener("click", async () => {
    const new_path = $("#rename-input").value;
    if (!new_path.trim()) { toast("Name cannot be empty.", "error"); return; }
    try {
      const res = await post("/rename", { id: renameTarget.id, new_path });
      toast(res.message + " " + renameTarget.path + " \u2192 " + new_path, "success");
      (res.warnings || []).forEach((w) => toast(w, "warning"));
      closeModals();
      await loadCategories();
    } catch (e) { toast(e.message, "error"); }
  });

  // ---- merge ----
  const mergeSource = $("#merge-source");
  const mergeTarget = $("#merge-target");

  function fillMergeSelects(preferSource, preferTarget) {
    mergeSource.innerHTML = "";
    mergeTarget.innerHTML = "";
    for (const c of state.categories) {
      const o1 = document.createElement("option");
      o1.value = c.id;
      o1.textContent = c.path;
      const o2 = o1.cloneNode(true);
      mergeSource.appendChild(o1);
      mergeTarget.appendChild(o2);
    }
    if (preferSource != null) mergeSource.value = String(preferSource);
    if (preferTarget != null) mergeTarget.value = String(preferTarget);
    if (mergeSource.value === "" && state.categories.length) mergeSource.value = String(state.categories[0].id);
    if (mergeTarget.value === "" && state.categories.length) mergeTarget.value = String((state.categories[1] || state.categories[0]).id);
    updateMergeResultName();
    validateMergeConfirm();
  }

  function selectedMergeOption() {
    const checked = document.querySelector('input[name="merge-name"]:checked');
    return checked ? checked.value : "target";
  }

  function currentResultName() {
    const src = mergeSource.options[mergeSource.selectedIndex];
    const tgt = mergeTarget.options[mergeTarget.selectedIndex];
    const mode = selectedMergeOption();
    if (mode === "source") return src ? src.textContent : "";
    if (mode === "custom") return $("#custom-name").value.trim();
    return tgt ? tgt.textContent : "";
  }

  function updateMergeResultName() {
    const name = currentResultName();
    $("#merge-result-name").textContent = name ? "Result: " + name : "Result: (no name)";
  }

  function validateMergeConfirm() {
    const ok = $("#merge-confirm").value.trim().toLowerCase() === "merge";
    const src = mergeSource.value;
    const tgt = mergeTarget.value;
    const same = src && src === tgt;
    $("#merge-submit").disabled = !(ok && !same);
    if (same) $("#merge-result-name").textContent = "Source and target must be different.";
    else updateMergeResultName();
  }

  function openMerge(preferSource, preferTarget) {
    fillMergeSelects(preferSource, preferTarget);
    // Sensible defaults: keep target name; drop the "source" radio preselection.
    document.querySelector('input[name="merge-name"][value="target"]').checked = true;
    $("#custom-name").value = "";
    $("#custom-name-wrap").style.display = "none";
    $("#merge-confirm").value = "";
    openModal("merge-modal");
  }

  mergeSource.addEventListener("change", validateMergeConfirm);
  mergeTarget.addEventListener("change", validateMergeConfirm);
  document.querySelectorAll('input[name="merge-name"]').forEach((r) =>
    r.addEventListener("change", () => {
      $("#custom-name-wrap").style.display = selectedMergeOption() === "custom" ? "block" : "none";
      updateMergeResultName();
    })
  );
  $("#custom-name").addEventListener("input", updateMergeResultName);
  $("#merge-confirm").addEventListener("input", validateMergeConfirm);

  $("#merge-submit").addEventListener("click", async () => {
    const source_id = Number(mergeSource.value);
    const target_id = Number(mergeTarget.value);
    const new_name = currentResultName();
    try {
      const res = await post("/merge", { source_id, target_id, new_name });
      toast(res.message, "success");
      closeModals();
      await loadCategories();
    } catch (e) { toast(e.message, "error"); }
  });

  // ---- delete ----
  let deleteTarget = null;

  function openDelete(c) {
    if (c.entry_count > 0) { toast("Cannot delete: category has " + c.entry_count + " entries.", "error"); return; }
    deleteTarget = c;
    $("#delete-info").innerHTML =
      "Category <b>" + esc(c.path) + "</b><br>Entries: <b>0</b><br>" +
      "Its keywords will be deleted too. This cannot be undone.";
    $("#delete-confirm").value = "";
    validateDeleteConfirm();
    openModal("delete-modal");
  }

  function validateDeleteConfirm() {
    $("#delete-submit").disabled = $("#delete-confirm").value.trim().toLowerCase() !== "delete";
  }
  $("#delete-confirm").addEventListener("input", validateDeleteConfirm);

  $("#delete-submit").addEventListener("click", async () => {
    try {
      const res = await post("/delete", { id: deleteTarget.id });
      toast(res.message, "success");
      closeModals();
      await loadCategories();
    } catch (e) { toast(e.message, "error"); }
  });

  // ---------- header controls ----------
  $("#refresh-btn").addEventListener("click", async () => {
    try {
      await loadCategories();
      toast("Categories refreshed.", "success");
    } catch (e) { toast(e.message, "error"); }
  });
  $("#suggest-btn").addEventListener("click", findSuggestions);
  $("#search").addEventListener("input", (e) => {
    state.search = e.target.value;
    renderTable();
  });

  // ---------- init ----------
  loadCategories().catch((e) => toast(e.message, "error"));
})();
</script>
</body>
</html>
